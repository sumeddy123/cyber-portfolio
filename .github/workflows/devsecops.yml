name: DevSecOps labs
on:
  push:
    branches: [main]
    paths: ['devsecops/**', '.github/workflows/devsecops.yml']
  pull_request:
    paths: ['devsecops/**', '.github/workflows/devsecops.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install runtime and security tools
        run: |
          python -m pip install -r devsecops/container-security-lab/requirements.txt
          python -m pip install -r devsecops/automated-security-pipeline/requirements-tools.txt
          mkdir -p reports
      - name: Test the log analyzer
        run: python -m unittest discover -s devsecops/security-alert-analyzer -v
      - name: Test the API
        run: python -m unittest discover -s devsecops/container-security-lab -v
      - name: Scan Python source with Bandit
        if: ${{ !cancelled() }}
        run: bandit devsecops/container-security-lab/app.py devsecops/security-alert-analyzer/analyzer.py -f json -o reports/bandit.json
      - name: Audit runtime dependencies
        if: ${{ !cancelled() }}
        run: pip-audit -r devsecops/container-security-lab/requirements.txt --no-deps --disable-pip -f json -o reports/dependencies.json
      - name: Scan working tree for secrets
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: devsecops
          scanners: secret
          format: json
          output: reports/secrets.json
          exit-code: '1'
      - name: Upload reports even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-security-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 14
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build container
        run: |
          mkdir -p reports
          docker build --pull -t portfolio-api:ci devsecops/container-security-lab
      - name: Verify non-root image and hardened runtime
        run: |
          test "$(docker image inspect portfolio-api:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run -d --name portfolio-api --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 100 --memory 256m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            -p 127.0.0.1:8080:8080 portfolio-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > reports/health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; assert json.load(open("reports/health.json")) == {"status": "ok"}'
          test "$(docker exec portfolio-api id -u)" = '10001'
          if docker exec portfolio-api touch /app/should-not-exist; then
            echo 'ERROR: application filesystem is writable'
            exit 1
          fi
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: portfolio-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: reports/container.json
          exit-code: '1'
      - name: Collect container logs
        if: always()
        run: docker logs portfolio-api > reports/container.log 2>&1 || true
      - name: Remove test container
        if: always()
        run: docker rm -f portfolio-api || true
      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-reports
          path: reports/
          retention-days: 14
